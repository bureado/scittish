name: Integration Tests

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

jobs:
  integration:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install oras CLI
      run: |
        VERSION="1.1.0"
        curl -LO "https://github.com/oras-project/oras/releases/download/v${VERSION}/oras_${VERSION}_linux_amd64.tar.gz"
        mkdir -p oras-install/
        tar -zxf oras_${VERSION}_*.tar.gz -C oras-install/
        sudo mv oras-install/oras /usr/local/bin/
        rm -rf oras_${VERSION}_*.tar.gz oras-install/
        oras version
    
    - name: Checkout SCITT CCF Ledger
      uses: actions/checkout@v4
      with:
        repository: microsoft/scitt-ccf-ledger
        path: scitt-ccf-ledger
    
    - name: Build SCITT ledger
      working-directory: scitt-ccf-ledger
      run: |
        export PLATFORM=virtual
        ./docker/build.sh
    
    - name: Start SCITT ledger
      working-directory: scitt-ccf-ledger
      run: |
        export PLATFORM=virtual
        # The run-dev.sh script ends with "docker logs -f" which blocks
        # We'll run the script in background and let it timeout after setup completes
        timeout 180 ./docker/run-dev.sh || [ $? -eq 124 ]
        
        # At this point, the ledger should be running in a container
        # Wait for ledger to be ready (retry for up to 60 seconds)
        echo "Verifying SCITT ledger is ready..."
        for i in {1..60}; do
          if curl -s -k https://localhost:8000/node/network >/dev/null 2>&1; then
            echo "SCITT ledger is ready!"
            break
          fi
          echo "Attempt $i: SCITT ledger not ready yet, waiting..."
          sleep 1
        done
        
        # Verify it's running and show the container status
        docker ps | grep scitt || docker ps -a | grep scitt
        curl -v -k https://localhost:8000/node/network || true
    
    - name: Start OCI registry
      run: |
        docker run -d -p 5000:5000 --name registry registry:2
        
        # Wait for registry to be ready
        echo "Waiting for OCI registry to be ready..."
        for i in {1..30}; do
          if curl -s http://localhost:5000/v2/ >/dev/null 2>&1; then
            echo "OCI registry is ready!"
            break
          fi
          echo "Attempt $i: OCI registry not ready yet, waiting..."
          sleep 1
        done
        
        # Verify it's running
        curl -v http://localhost:5000/v2/
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r api/requirements.txt -r requirements-dev.txt
    
    - name: Run integration tests
      run: |
        pytest -m integration -v
    
    - name: Show ledger logs on failure
      if: failure()
      working-directory: scitt-ccf-ledger
      run: |
        docker ps -a
        docker logs $(docker ps -a --filter "name=ccf" --format "{{.Names}}" | head -n 1) || true
    
    - name: Show registry logs on failure
      if: failure()
      run: |
        docker logs registry || true
