# pyproject.toml for scittish-cli
[build-system]
requires = ["setuptools >= 64"]
build-backend = "setuptools.build_meta"

[project]
name = "scittish-cli"
version = "0.1.0"
description = "CLI client for scittish SCITT signing service"
requires-python = ">=3.10"
dependencies = [
    "httpx",
]

[project.optional-dependencies]
pyscitt = [
    "pyscitt",
]

[project.scripts]
scittish-cli = "scittish_cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["scittish_cli*"]
